# EasyWAF Configuration — container image
#
# Nothing security-sensitive is set here any more, which is the point. Before
# 0.4.2 this file carried a `secret` that signed session and CAPTCHA-clearance
# cookies and was published inside the image for everyone to read. The signing
# key is now generated on first run and stored in the database, and the
# administrator account is created through the GUI at first start.
#
# The database lives in /data, declared as a volume by the image so it survives
# the container. That comes from the DATABASE_URL environment variable set in
# the Dockerfile — override it with `-e DATABASE_URL=...` if you mount the
# volume somewhere else.
#
# Override this file to change anything below:
#   docker run -v ./config.toml:/opt/easywaf/config.toml ...

[proxy]
http_port    = 8081      # placeholder, not read
gui_port     = 8080      # management GUI: plain HTTP, redirects to gui_tls_port
gui_tls_port = 8443      # management GUI: served here, over TLS
geoip_db     = ""        # external .mmdb; empty = bundled DB-IP Lite
acme_webroot = ""        # placeholder, not read
