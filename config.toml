# EasyWAF Configuration

# The cookie signing key is generated on first run and stored in the database,
# and the administrator account is created through the GUI at first start —
# neither is configured here. The database path defaults to ./easywaf.db and can
# be overridden with the DATABASE_URL environment variable.

[proxy]
http_port  = 8081        # HTTP reverse proxy port (use 80 in production)
gui_port   = 8080        # Management GUI: plain HTTP, redirects to gui_tls_port
gui_tls_port = 8443      # Management GUI: served here, over TLS
geoip_db   = ""          # Path to GeoLite2-Country.mmdb (leave empty to disable)
acme_webroot = ""        # Path for ACME HTTP-01 challenge files
