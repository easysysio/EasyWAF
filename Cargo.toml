[package]
name = "easywaf"
version = "0.6.11"
edition = "2024"
authors = ["Yariv Hakim"]
description = "EasyWAF - Self-contained Web Application Firewall and Reverse Proxy"
license = "GPL-3.0"
repository = "https://github.com/easysysio/EasyWAF"
homepage = "https://github.com/easysysio/EasyWAF"

[[bin]]
name = "easywaf"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8.4", features = ["macros", "json", "tokio", "multipart"] }
# tls-rustls-no-provider rather than tls-rustls: the latter pulls
# rustls/aws-lc-rs, which adds a C build to the aarch64 cross-compile. ring is
# already in the tree via reqwest and sqlx, so the provider is chosen
# explicitly at startup instead.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Self-signed certificate generation for the management interface's first run
rcgen = "0.13"

# Parsing uploaded certificate and key PEM for per-site TLS
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }

# Async runtime
tokio = { version = "1.34", features = ["full"] }

# HTTP client (upstream proxying)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Templates
tera = "1.20"

# Configuration
toml = "0.8.0"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# Auth
bcrypt = "0.17.0"

# IP geolocation — reads the bundled DB-IP Lite country database
maxminddb = "0.30"

# Static file serving (set-header lets us send Cache-Control on /static)
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tower = "0.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
urlencoding = "2.1"
async-trait = "0.1"
futures = "0.3"
bytes = "1.6"

# WAF pattern matching — uses a safe automata engine (no ReDoS risk)
regex = "1"

# CAPTCHA challenge (self-hosted, pure-Rust image generation) + helpers
captcha = "0.0.9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
x509-parser = "0.18.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
pgp = "0.20.0"
# Templates and static files are compiled in, so the binary is the whole GUI.
# mime-guess is already in the tree (reqwest pulls it), so the feature costs
# nothing and beats hand-maintaining an extension table that fails silently.
rust-embed = { version = "8", features = ["mime-guess"] }

# ─── Debian package (.deb) — cargo-deb ──────────────────────
# Binary → /usr/bin; runtime assets → /opt/easywaf (the systemd unit sets
# WorkingDirectory there). Asset source paths under target/release are
# auto-rewritten to the per-target dir when building with --target.
[package.metadata.deb]
maintainer = "Yariv Hakim"
# Reloads systemd and restarts a running service on upgrade — see
# packaging/deb/postinst for why.
maintainer-scripts = "packaging/deb"
copyright = "2025, Yariv Hakim"
section = "net"
priority = "optional"
depends = "libc6"
extended-description = """\
EasyWAF is a self-contained Web Application Firewall and HTTP reverse proxy.
It hosts multiple virtual sites, inspects traffic through a rule pipeline
(OWASP-style WAF rules, GeoIP), and ships a web management GUI."""
assets = [
    ["target/release/easywaf",        "/usr/bin/easywaf",                       "755"],
    # Templates and static assets are compiled into the binary. Shipping copies
    # as well would be worse than redundant: someone editing the installed file
    # would see no effect and no error.
    # The offline seed for the mirror. What the appliance enforces is read from
    # rules-cache/, which these seed on a first run with no network.
    ["rules/*.rules.toml",            "/opt/easywaf/rules/",                     "644"],
    # key.gpg is NOT shipped. The key every update is verified against is
    # compiled into the binary, so an installation cannot be missing its trust
    # anchor — 0.6.0 and 0.6.1 were, and could not apply a single update. A
    # file here still wins, so an operator running their own channel can sign
    # with their own key; because the package no longer writes one, its
    # presence is always somebody's decision, and it is logged on every use.
    ["rules/SOURCE",                  "/opt/easywaf/rules/SOURCE",              "644"],
    # The manifest, so Import can tell a basic set from an optional one.
    ["rules/sets.toml",               "/opt/easywaf/rules/sets.toml",           "644"],
    ["config.toml",                   "/opt/easywaf/config.toml",               "644"],
    ["packaging/easywaf.service",     "/lib/systemd/system/easywaf.service",    "644"],
    ["CHANGELOG.md",                  "/usr/share/doc/easywaf/CHANGELOG.md",    "644"],
]

# ─── RPM package (.rpm) — cargo-generate-rpm ────────────────
[package.metadata.generate-rpm]
summary = "Self-contained Web Application Firewall and reverse proxy"
# Same as the Debian postinst: an upgrade replaces the binary and the unit file
# on disk, but the running service keeps the old image until it is restarted,
# so the GUI would go on reporting the previous version.
# try-restart leaves a stopped service stopped, so a first install is unaffected.
post_install_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
systemctl try-restart easywaf.service >/dev/null 2>&1 || :
"""
# Mirrors packaging/deb/prerm. rpm passes the number of remaining copies of the
# package: 0 on a real removal, 1 during an upgrade — so the guard is what keeps
# an upgrade from stopping the service the post-install step is about to
# restart.
pre_uninstall_script = """
if [ "$1" = 0 ]; then
    systemctl --no-reload disable easywaf.service >/dev/null 2>&1 || :
    systemctl stop easywaf.service >/dev/null 2>&1 || :
fi
"""
assets = [
    { source = "target/release/easywaf",     dest = "/usr/bin/easywaf",                    mode = "755" },
    # Templates and static assets are compiled into the binary; see the .deb
    # asset list above for why copies are not shipped alongside.
    { source = "rules/*.rules.toml",         dest = "/opt/easywaf/rules/",                 mode = "644" },
    { source = "rules/SOURCE",               dest = "/opt/easywaf/rules/SOURCE",           mode = "644" },
    { source = "rules/sets.toml",            dest = "/opt/easywaf/rules/sets.toml",        mode = "644" },
    { source = "config.toml",                dest = "/opt/easywaf/config.toml",            mode = "644" },
    { source = "packaging/easywaf.service",  dest = "/usr/lib/systemd/system/easywaf.service", mode = "644" },
    { source = "CHANGELOG.md",               dest = "/usr/share/doc/easywaf/CHANGELOG.md", mode = "644" },
]
