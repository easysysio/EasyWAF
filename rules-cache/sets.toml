# =========================================================
# sets.toml — EasyWAF rule sets
#
# The index of what this repository publishes. A build reads
# it to decide what to bundle; EasyWAF reads the published
# copy to decide what it can update.
#
# tier:
#   basic     bundled with every EasyWAF build and installed
#             by default. Protections no deployment should be
#             without, which assume nothing about the
#             application behind the proxy.
#   optional  published and updatable, never bundled. Sets
#             that only make sense for one application —
#             WordPress, and whatever follows — where the
#             cost of matching would be paid by everyone and
#             the benefit collected by the few running it.
#
# description is one sentence, shown beside the set in the
# Rule Sets page of every installation. It is what someone
# reads when deciding whether they want the set at all, so
# say what it matches rather than restating the name.
#
# version is how an installation knows an update exists: it
# compares the version it holds against the version
# published. Bump it whenever a set's content changes.
# publish.sh refuses to publish a changed set whose version
# stood still, because a corrected rule nobody is told about
# is the same as no correction at all.
#
# A set's id is permanent. It appears in EasyWAF's database
# and in the update channel, so renaming one orphans every
# installation that has it.
#
# Rule id namespaces:
#   9xxxxx    OWASP CRS numbering, written for EasyWAF.
#   101xxxx+  Application sets, stepping 10000 per set.
#   2xxxxxx   Converted from a CRS rule by
#             scripts/modsec2easywaf.py: 2000000 + the original
#             CRS id, so 2944100 is CRS 944100. The offset
#             exists because CRS numbering collides with the
#             OWASP-numbered sets above, and external_id is
#             unique per policy.
#
# sha256 is added by publish.sh, not written here.
# =========================================================

