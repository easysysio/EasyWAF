# Java and Tomcat (band 1030)
#
# Optional, and only meaningful in front of a Java application — Tomcat, Spring,
# JBoss, or anything else on the JVM. Java deserialization payloads, malicious
# class loading, and suspicious Java class and method names in request data.
#
# In front of anything else these can only cost matching time and match
# something legitimate, which is what the optional tier exists to prevent.
#
# Derived from OWASP CRS `main` (2026-09-09),
# REQUEST-944-APPLICATION-ATTACK-JAVA.conf, converted by
# scripts/modsec2easywaf.py. Apache-2.0; see LICENSE and NOTICE. Each rule
# records its original CRS id and paranoia level.
#
# CRS PARANOIA LEVELS 1 AND 2. Level 2 is opt-in upstream, which is a
# reasonable trade in a set that is itself opt-in and installed only in front
# of the stack it names — the traffic is narrower and so is the risk. Level 3
# is excluded: CRS 944300 matches a base64 string containing a suspicious
# keyword, which fires on ordinary encoded payloads.
#
# LOG4SHELL IS NOT COVERED. CRS detects it with rules 944150-944152, and all
# three depend on t:htmlEntityDecode and t:jsDecode — EasyWAF does not perform
# those transformations, so converting them would have produced rules that look
# like Log4Shell protection and can be evaded by the encoding they were written
# to see through. If you run a JVM application exposed to the internet, do not
# treat this set as covering it.
#
# EVERY RULE HERE IS WIDENED. CRS targets named variables and excludes others;
# EasyWAF's zone is a single choice, so each inspects more of the request than
# the original did. That does not create a hole, it creates false positives —
# so if a rule here blocks something legitimate, exclude it for that site
# rather than distrusting the set.

[set]
id      = "java"
name    = "Java and Tomcat"
version = 2

[[rules]]
id          = 2944100
name        = 'Remote Command Execution: Suspicious Java class detected'
description = 'Converted from ModSecurity rule 944100 (severity CRITICAL, CRS paranoia level 1); original transforms t:lowercase; WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = '(?i)java\.lang\.(?:runtime|processbuilder)'
score       = 5
action      = "score"

[[rules]]
id          = 2944130
name        = 'Suspicious Java class detected'
description = 'Converted from ModSecurity rule 944130 (severity CRITICAL, CRS paranoia level 1); WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = '(?i)(?:com\.opensymphony\.xwork2|com\.sun\.org\.apache|classLoader|declaredClass|freemarker\.core|freemarker\.template|freemarker\.ext\.rhino|java\.io\.BufferedInputStream|java\.io\.BufferedReader|java\.io\.ByteArrayInputStream|java\.io\.ByteArrayOutputStream|java\.io\.CharArrayReader|java\.io\.DataInputStream|java\.io\.File|java\.io\.FileOutputStream|java\.io\.FilePermission|java\.io\.FileWriter|java\.io\.FilterInputStream|java\.io\.FilterOutputStream|java\.io\.FilterReader|java\.io\.InputStream|java\.io\.IOException|java\.io\.LineNumberReader|java\.io\.ObjectInputStream|java\.io\.ObjectOutputStream|java\.io\.OutputStream|java\.io\.PipedOutputStream|java\.io\.PipedReader|java\.io\.PrintStream|java\.io\.PushbackInputStream|java\.io\.Reader|java\.io\.StringReader|java\.lang\.Class|java\.lang\.Enum|java\.lang\.Integer|java\.lang\.Number|java\.lang\.Object|java\.lang\.Process|java\.lang\.ProcessBuilder|java\.lang\.reflect|java\.lang\.Runtime|java\.lang\.String|java\.lang\.System|java\.net\.HttpURLConnection|java\.net\.JarURLConnection|java\.net\.DatagramSocket|java\.net\.MulticastSocket|java\.net\.ServerSocket|java\.net\.Socket|java\.net\.URL|javassist|javax\.naming\.InitialContext|javax\.script\.ScriptEngineManager|javax\.xml\.parsers|javax\.xml\.stream|OgnlContext|OgnlUtil|org\.apache\.commons|org\.apache\.struts|org\.apache\.struts2|org\.dom4j\.io\.SAXReader|org\.jdom2\.input\.SAXBuilder|org\.omg\.CORBA|org\.xml\.sax|PropertyUtilsBean|java\.beans\.XMLDecode|java\.nio\.file|sun\.reflect)'
score       = 5
action      = "score"

[[rules]]
id          = 2944200
name        = 'Magic bytes Detected, probable java serialization in use'
description = 'Converted from ModSecurity rule 944200 (severity CRITICAL, CRS paranoia level 2); WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = '\xac\xed\x00\x05'
score       = 5
action      = "score"

[[rules]]
id          = 2944210
name        = 'Magic bytes Detected Base64 Encoded, probable java serialization in use'
description = 'Converted from ModSecurity rule 944210 (severity CRITICAL, CRS paranoia level 2); WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = '(?:rO0ABQ|KztAAU|Cs7QAF)'
score       = 5
action      = "score"

[[rules]]
id          = 2944240
name        = 'Remote Command Execution: Java serialization (CVE-2015-4852)'
description = 'Converted from ModSecurity rule 944240 (severity CRITICAL, CRS paranoia level 2); original transforms t:lowercase; WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = '(?i)(?:clonetransform|xmldecod)er|f(?:orclosure|ilewriter)|in(?:stantiate(?:factory|transformer)|vokertransformer)|(?:prototype(?:clone|serialization)factor|getpropert)y|whileclosure'
score       = 5
action      = "score"

[[rules]]
id          = 2944250
name        = 'Remote Command Execution: Suspicious Java method detected'
description = 'Converted from ModSecurity rule 944250 (severity CRITICAL, CRS paranoia level 2); original transforms t:lowercase; WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = '(?i)java\b.+(?:runtime|processbuilder)'
score       = 5
action      = "score"

[[rules]]
id          = 2944260
name        = 'Remote Command Execution: Malicious class-loading payload'
description = 'Converted from ModSecurity rule 944260 (severity CRITICAL, CRS paranoia level 2); original transforms t:urldecodeuni; WIDENED — inspects more than the original did'
zone        = "ANY"
pattern     = 'class\.module\.classLoader\.resources\.context\.parent\.pipeline|springframework\.context\.support\.FileSystemXmlApplicationContext'
score       = 5
action      = "score"
