# Credential and secret file exposure (band 1040)
#
# Requests for files that hold credentials — cloud keys, SSH keys, CI secrets,
# container registry logins, IDE deployment profiles. None of these is ever
# fetched by a browser rendering a page. A request for one is someone checking
# whether a deployment left it reachable, and the answer, when it is yes, is a
# working key.
#
# Derived from the paths in OWASP-adjacent scanning corpora, principally the
# ProjectDiscovery nuclei-templates exposure and misconfiguration sets (MIT).
# See LICENSE-MIT and NOTICE. Paths already matched by the scanners set were
# dropped rather than repeated: two rules matching one request both add their
# score, which halves a policy's effective threshold for that request.
#
# EVERY PATTERN IS ANCHORED TO THE PATH ROOT (^/), and that is the whole
# difference between this set being usable and being a liability. On a site
# that hosts git repositories, browses code, or serves documentation, paths
# like /owner/repo/blob/main/.gitlab-ci.yml and /docs/.vscode/settings.json are
# ordinary content. Matching those strings anywhere in the URL would block a
# git host's normal traffic; matching them only at the root cannot.
#
# Optional, not basic. These are new here and have not run against real traffic
# in this project. Promote them once they have.

[set]
id      = "secrets"
name    = "Credential and secret file exposure"
version = 1

[[rules]]
id          = 1040001
name        = "Exposure: cloud provider credentials"
description = "AWS, Google Cloud and Azure credential files at the document root"
zone        = "URL"
# Blocked outright. There is no legitimate request to weigh against it: these
# files are read by SDKs from a home directory, never served over HTTP, and a
# successful fetch hands over an account.
pattern     = '(?i)^/\.(aws/(config|credentials)|config/gcloud/[^?]*credential|azure/)'
score       = 10
action      = "block"

[[rules]]
id          = 1040002
name        = "Exposure: SSH keys and known hosts"
description = "Private keys, authorized_keys and known_hosts under the document root"
zone        = "URL"
# authorized_keys and known_hosts are as valuable as the private key to an
# attacker mapping which machines trust which — and none of them belongs on a
# web server at all.
pattern     = '(?i)^/\.ssh/(authorized_keys|known_hosts[^?]*|id_[a-z0-9]+|[^/?]*\.ppk)(\?|$)'
score       = 10
action      = "block"

[[rules]]
id          = 1040003
name        = "Exposure: shell and package manager credentials"
description = ".netrc, .npmrc, .pypirc, .gem/credentials and shell history"
zone        = "URL"
# .netrc and .npmrc routinely carry registry tokens in plain text; shell
# history routinely carries whatever was typed on a command line, which is
# frequently a password.
pattern     = '(?i)^/\.(netrc|npmrc|pypirc|bash_history|zsh_history|gem/credentials)'
score       = 10
action      = "block"

[[rules]]
id          = 1040004
name        = "Exposure: container registry credentials"
description = "Docker config files, which hold registry authentication"
zone        = "URL"
pattern     = '(?i)^/\.(docker/config\.json|dockercfg)(\?|$)'
score       = 10
action      = "block"

[[rules]]
id          = 1040005
name        = "Exposure: CI pipeline configuration and secrets"
description = "GitLab CI, CircleCI and pipeline variable files at the root"
zone        = "URL"
# Scored rather than blocked, and root-anchored for the reason in the header:
# on a git host these filenames are content. At the document root of an
# application they are a deployment leaking its pipeline, which names internal
# hosts and sometimes carries secrets outright.
pattern     = '(?i)^/\.(gitlab-ci\.yml|gitlab-ci/|circleci/|gitlab/renovate)'
score       = 7
action      = "score"

[[rules]]
id          = 1040006
name        = "Exposure: IDE and editor deployment profiles"
description = ".idea and .vscode files naming servers, SFTP targets and stored requests"
zone        = "URL"
# JetBrains and VS Code write deployment targets — hostnames, usernames, and
# often passwords — into these. They reach a web root when a project directory
# is deployed wholesale.
pattern     = '(?i)^/\.(idea/|vscode(-server)?/)'
score       = 9
action      = "score"

[[rules]]
id          = 1040007
name        = "Exposure: application secret files"
description = "secrets.yml, credentials.json, service account keys and private keys"
zone        = "URL"
# The names frameworks and cloud SDKs actually use, at the root or at most two
# directories below it — where a framework puts them.
#
# Not at any depth, deliberately. Nextcloud and Immich serve user files under
# long paths, and a user is entitled to store a file called credentials.json in
# their own cloud; matching at any depth would refuse them their own data. Two
# levels reaches config/secrets.yml without reaching /remote.php/dav/files/...
pattern     = '(?i)^/([^/?]{1,40}/){0,2}((user_)?secrets\.ya?ml|client_secrets\.json|(service-?account-?)?credentials\.(json|db)|oauth-credentials\.json|oauth-private\.key|\.git-credentials)(\?|$)'
score       = 10
action      = "block"

[[rules]]
id          = 1040008
name        = "Exposure: version control metadata beyond git"
description = "Mercurial and Bazaar branch configuration at the document root"
zone        = "URL"
# Subversion and git are covered by the scanners set. These two are not, and
# they leak the same thing: repository layout, remote URLs and sometimes
# embedded credentials.
pattern     = '(?i)^/\.(hg/hgrc|hgignore|bzr/)'
score       = 8
action      = "score"
