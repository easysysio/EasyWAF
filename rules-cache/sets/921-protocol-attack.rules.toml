# Protocol attack (band 921)
#
# Request smuggling, response splitting and header injection: attacks on how
# the request itself is framed, rather than on what it carries. Distinct from
# the 920 protocol set, which is about malformed and abusive requests.
#
# Derived from OWASP CRS `main` (2026-09-09), REQUEST-921-PROTOCOL-ATTACK.conf,
# converted by scripts/modsec2easywaf.py. Apache-2.0; see LICENSE and NOTICE.
# Each rule records its original CRS id and paranoia level.
#
# CRS PARANOIA LEVEL 1 ONLY. CRS ships at level 1 and an operator raises it
# deliberately, accepting more false positives for more coverage. Converting
# every level would put rules CRS itself does not run into a set that is always
# on — and it showed: the level 3 and 4 rules here flag `ids[]=1&ids[]=2`,
# which is ordinary array notation in PHP, Rails and most JavaScript
# frameworks.
#
# These five convert exactly: same pattern, same zone, nothing widened.
#
#   2921140  a CR or LF injected through a request header
#   2921150  a CR or LF in a parameter value
#   2921160  the same, with a header name after it
#   2921190  a CR or LF in the request path — request splitting
#   2921240  the `unix:...|` form behind the mod_proxy SSRF, which matters in
#            front of Apache in particular
#
# Optional rather than basic: these are converted rules that have not yet run
# against real traffic here. Promote them once they have.

[set]
id      = "owasp-protocol-attack"
name    = "Protocol attack"
version = 2

[[rules]]
id          = 2921140
name        = 'HTTP Header Injection Attack via headers'
description = 'Converted from ModSecurity rule 921140 (severity CRITICAL, CRS paranoia level 1); original transforms t:urldecodeuni'
zone        = "HEADERS"
pattern     = '[\n\r]'
score       = 5
action      = "score"

[[rules]]
id          = 2921150
name        = 'HTTP Header Injection Attack via payload (CR/LF detected)'
description = 'Converted from ModSecurity rule 921150 (severity CRITICAL, CRS paranoia level 1)'
zone        = "ARGS"
pattern     = '[\n\r]'
score       = 5
action      = "score"

[[rules]]
id          = 2921160
name        = 'HTTP Header Injection Attack via payload (CR/LF and header-name detected)'
description = 'Converted from ModSecurity rule 921160 (severity CRITICAL, CRS paranoia level 1); original transforms t:lowercase'
zone        = "ARGS"
pattern     = '(?i)[\n\r]+(?:[\s\x0b]|location|re(?:fresh|mote-(?:ip|addr))|(?:set-)?cookie|forwarded-(?:(?:fo|serve)r|host)|host|via|originating-IP|x-(?:forwarded-(?:(?:fo|serve)r|host)|host|via|remote-(?:ip|addr)|originating-IP))[\s\x0b]*:'
score       = 5
action      = "score"

[[rules]]
id          = 2921190
name        = 'HTTP Splitting (CR/LF in request filename detected)'
description = 'Converted from ModSecurity rule 921190 (severity CRITICAL, CRS paranoia level 1); original transforms t:urldecodeuni'
zone        = "URL"
pattern     = '[\n\r]'
score       = 5
action      = "score"

[[rules]]
id          = 2921240
name        = 'mod_proxy attack attempt detected'
description = 'Converted from ModSecurity rule 921240 (severity CRITICAL, CRS paranoia level 1); original transforms t:urldecodeuni,lowercase'
zone        = "URL"
pattern     = '(?i)unix:[^|]*\|'
score       = 5
action      = "score"
