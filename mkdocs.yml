# EasyWAF documentation site — https://easywaf.easysys.io
#
# Same design as easysys.io and easylog.easysys.io. The landing page
# (docs/index.md) is drawn with the EasySYS `es-*` components copied into
# stylesheets/easysys.css; the documentation pages keep Material's navigation
# and search, themed with the same tokens in stylesheets/easywaf.css. The pages
# live beside the code they describe, so a change and its documentation land in
# one commit.
#
# Build:   pip install -r docs-requirements.txt && mkdocs serve
# Deploy:  ./deploy-docs.sh   (on the host that serves the site)

site_name: EasyWAF
site_url: https://easywaf.easysys.io/
site_description: A self-contained web application firewall and HTTP reverse proxy, in a single Rust binary.
repo_url: https://github.com/easysysio/EasyWAF
repo_name: easysysio/EasyWAF
copyright: GPL-3.0-or-later licensed · part of the EasySYS suite

# The design notes are working documents — unshipped plans, arguments with
# earlier decisions — and they live in this directory because they belong
# beside the code. They are not part of the site.
exclude_docs: |
  design/

nav:
  - Home: index.md
  - Documentation:
      - Overview: overview.md
      - Getting started:
          - Installation: install.md
          - First run: first-run.md
      - Using EasyWAF:
          - Sites: sites.md
          - TLS and certificates: tls.md
          - Policies and rules: policies.md
          - IP lists: ip-lists.md
          - Updates: updates.md
          - Traffic: traffic.md
          - Accounts and roles: accounts.md
          - Logging: logging.md
      - Reference:
          - Configuration: configuration.md
          - Troubleshooting: troubleshooting.md
          - What EasyWAF does not do: limitations.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/easysysio/EasyWAF
    - icon: fontawesome/solid/globe
      link: https://easysys.io
    - icon: fontawesome/brands/discord
      link: https://discord.gg/easysys

extra_css:
  # Bump ?v= whenever a stylesheet changes so browsers fetch the new file
  # instead of serving a cached copy.
  - stylesheets/easysys.css?v=1
  - stylesheets/easywaf.css?v=1
