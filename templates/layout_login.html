<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyWAF — Login</title>

    <!-- Apply saved theme before paint to avoid a flash of the wrong theme.
         Preference may be 'auto' (follow OS), 'light' or 'dark'. -->
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('easywaf-theme') || 'auto';
                var resolved = (pref === 'light' || pref === 'dark') ? pref
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', resolved);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/static/vendor/font-awesome/css/font-awesome.min.css">
    <!-- Outfit and Inter, shipped with EasyWAF -->
    <link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
    <!-- Custom -->

    <!-- SVG first for browsers that take it, PNG for those that do not.
         Versioned like the other static assets so a change is picked up
         rather than served from cache. -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
    <link rel="alternate icon" type="image/png" href="/static/favicon.png?v=1">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">

    <link rel="stylesheet" href="/static/css/easywaf.css?v=3">

    <style>
        .login-panel { margin-top: 10%; }
    </style>
</head>
<body>
{% block content %}{% endblock %}

<!-- jQuery -->
<script src="/static/vendor/jquery/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 3 JS -->
<script src="/static/vendor/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
