name: Release

# Two ways in:
#   tag push      git tag v0.1.0 && git push origin v0.1.0
#                 -> builds packages AND publishes a GitHub Release (stable channel)
#   manual run    Actions -> Release -> Run workflow, on any branch
#                 -> builds packages only, left as run artifacts (testing channel)
# github2repo.sh in the EasyWAF-repo project consumes both: --stable pulls the
# release assets, --testing pulls the packages-* artifacts of a workflow run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Every action is pinned to a full commit, with the release it was in beside
# it: a tag can be moved to other code, a commit cannot.
#
# Read-only by default; the one job that creates the GitHub Release is given
# write access below.
permissions:
  contents: read

jobs:
  # ─── Lint and audit, before anything is built ───────────────
  # The same checks every push runs (checks.yml). The build needs this job,
  # so a tag whose code fails either publishes nothing: no packages, no
  # image, no release.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # ─── Build .deb and .rpm for each architecture ──────────────
  build:
    name: Build ${{ matrix.arch }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        # Pinned by commit, so the toolchain is named: the action reads it from
        # the ref only when the ref is a branch name.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install packaging tools
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Prepare sqlx database
        # sqlx's compile-time query! macros validate against a real schema.
        # Apply every migration in order to build the full schema.
        run: |
          sudo apt-get install -y sqlite3
          rm -f easywaf.db
          for f in migrations/*.sql; do
            echo "applying $f"
            sqlite3 easywaf.db < "$f"
          done

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          DATABASE_URL: sqlite://easywaf.db
          # Cross toolchain for aarch64 (ring + bundled sqlite need a target CC).
          # These are ignored when building the x86_64 target.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Stage binary for packaging
        # Ensure target/release/easywaf exists so both packagers resolve the
        # asset path whether or not they rewrite it for --target.
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/easywaf" target/release/easywaf

      - name: Compute testing-build version
        # A manual run publishes to the testing channel, where every build must
        # outrank both the last testing build and the released version — the
        # version in Cargo.toml doesn't change between releases, so without a
        # suffix apt/dnf see an already-installed NVR and refuse to upgrade.
        # run_number orders the builds; the short SHA says what was built.
        # '+' sorts ABOVE the plain release in both dpkg and rpm version
        # comparison, which is what a testing channel wants ('~' would sort
        # below and make testing look older than stable). Tag builds set
        # nothing here and keep the clean version from Cargo.toml.
        if: github.event_name == 'workflow_dispatch'
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SUFFIX="ci${{ github.run_number }}.git$(git rev-parse --short HEAD)"
          # Keep the "-1" revision so the .deb stays a non-native package,
          # same shape as the stable one.
          echo "DEB_VERSION=${VER}+${SUFFIX}-1" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=1+${SUFFIX}"        >> "$GITHUB_ENV"
          echo "Testing build version: ${VER}+${SUFFIX}"

      - name: Build .deb
        run: |
          if [ -n "${DEB_VERSION:-}" ]; then
            cargo deb --no-build --no-strip --target ${{ matrix.target }} \
                      --deb-version "$DEB_VERSION"
          else
            cargo deb --no-build --no-strip --target ${{ matrix.target }}
          fi

      - name: Build .rpm
        # auto-req disabled: dependency scanning on a cross-built binary is
        # unreliable on the host; the binary only needs glibc which is ubiquitous.
        run: |
          if [ -n "${RPM_RELEASE:-}" ]; then
            cargo generate-rpm --target ${{ matrix.target }} --auto-req disabled \
                               -s "release = \"$RPM_RELEASE\""
          else
            cargo generate-rpm --target ${{ matrix.target }} --auto-req disabled
          fi

      - name: Collect packages
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/debian/*.deb out/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm out/
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.arch }}
          path: out/*

      # Kept separate from the packages artifact, which github2repo.sh consumes
      # by extension — the container image needs the bare binary.
      - name: Upload binary for the container image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/easywaf

  # ─── Build and push the container image ─────────────────────
  # Uses the binaries from the build matrix rather than compiling again, so the
  # image ships exactly what was released and arm64 needs no QEMU emulation.
  docker:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    # Only a tag names a version to publish under; a manual run stops after the
    # build job, same as the release job below.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: binaries

      - name: Stage binaries for the image
        # The Dockerfile picks by Docker's architecture names, which differ from
        # the ones used for the packages: x86_64 -> amd64.
        run: |
          mkdir -p dist
          cp binaries/binary-x86_64/easywaf dist/easywaf-amd64
          cp binaries/binary-arm64/easywaf  dist/easywaf-arm64
          chmod +x dist/easywaf-*
          ls -l dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"     # v0.3.0 -> 0.3.0
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing easysysio/easywaf:$VERSION and :latest"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            easysysio/easywaf:${{ env.VERSION }}
            easysysio/easywaf:latest
          labels: |
            org.opencontainers.image.title=EasyWAF
            org.opencontainers.image.description=Self-contained Web Application Firewall and reverse proxy
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/easysysio/EasyWAF
            org.opencontainers.image.licenses=GPL-3.0-or-later

      # The overview shown on the Docker Hub repository page. Pushed from the
      # repository so it is versioned and reviewed like anything else, rather
      # than being typed into a web form once and quietly going stale.
      #
      # Non-fatal on purpose. Docker Hub's description API has historically
      # wanted the account password rather than an access token, so this can
      # fail on token scope alone — and an image that published successfully
      # must not be reported as a failed release because its README did not
      # update. Check the step's log after a release; if it fails, give
      # DOCKERHUB_TOKEN a scope that permits it, or drop this step and edit the
      # page by hand.
      - name: Update the Docker Hub overview
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: easysysio/easywaf
          readme-filepath: docker/README.md
          short-description: Self-contained web application firewall and reverse proxy

  # ─── Create the GitHub Release ──────────────────────────────
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag carries a version to release under — a manual run stops after
    # the build job and leaves the packages as downloadable artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and tags: the release notes list the commits since the
          # previous tag, which a shallow clone cannot see.
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"     # v0.1.0 -> 0.1.0
          echo "Extracting notes for version: $VERSION"

          # Pull the section under "## [VERSION]" up to the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/           { exit }
            grab                       { print }
          ' CHANGELOG.md > notes.md

          # Fall back to the [Unreleased] section if no version section exists.
          if [ ! -s notes.md ]; then
            echo "No [$VERSION] section found — falling back to [Unreleased]"
            awk '
              /^## \[Unreleased\]/ { grab=1; next }
              grab && /^## \[/     { exit }
              grab                 { print }
            ' CHANGELOG.md > notes.md
          fi

          # Final fallback so the release is never created with empty notes.
          if [ ! -s notes.md ]; then
            echo "EasyWAF $VERSION" > notes.md
          fi

          # Who changed what, taken from git rather than written by hand.
          #
          # A CHANGELOG line is written before its commit exists, so it cannot
          # carry that commit's hash — and amending it in would change the hash
          # it just recorded. Generating the list at release time is the only
          # way for it to be right, and it cannot drift from the history.
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${GITHUB_REF_NAME}"
            echo "Listing commits in $RANGE"
          else
            RANGE="${GITHUB_REF_NAME}"
            echo "No previous tag; listing all commits up to ${GITHUB_REF_NAME}"
          fi

          {
            echo
            echo "### Commits"
            echo
            # The hash is deliberately not in backticks: GitHub turns a bare
            # SHA in a release body into a link to the commit, and turns one in
            # backticks into unclickable code. %an is the commit author, which
            # is not necessarily everyone a Co-Authored-By trailer names.
            git log --no-merges --reverse --format='- %h %s — %an' "$RANGE"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full changelog:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } >> notes.md

          echo "----- release notes -----"
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: EasyWAF ${{ github.ref_name }}
          body_path: notes.md
          files: dist/**/*
          fail_on_unmatched_files: true
