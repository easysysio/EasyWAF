name: Release

# Two ways in:
#   tag push      git tag v0.1.0 && git push origin v0.1.0
#                 -> builds packages AND publishes a GitHub Release (stable channel)
#   manual run    Actions -> Release -> Run workflow, on any branch
#                 -> builds packages only, left as run artifacts (testing channel)
# github2repo.sh in the EasyWAF-repo project consumes both: --stable pulls the
# release assets, --testing pulls the packages-* artifacts of a workflow run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  # ─── Build .deb and .rpm for each architecture ──────────────
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Prepare sqlx database
        # sqlx's compile-time query! macros validate against a real schema.
        # Apply every migration in order to build the full schema.
        run: |
          sudo apt-get install -y sqlite3
          rm -f easywaf.db
          for f in migrations/*.sql; do
            echo "applying $f"
            sqlite3 easywaf.db < "$f"
          done

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          DATABASE_URL: sqlite://easywaf.db
          # Cross toolchain for aarch64 (ring + bundled sqlite need a target CC).
          # These are ignored when building the x86_64 target.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Stage binary for packaging
        # Ensure target/release/easywaf exists so both packagers resolve the
        # asset path whether or not they rewrite it for --target.
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/easywaf" target/release/easywaf

      - name: Compute testing-build version
        # A manual run publishes to the testing channel, where every build must
        # outrank both the last testing build and the released version — the
        # version in Cargo.toml doesn't change between releases, so without a
        # suffix apt/dnf see an already-installed NVR and refuse to upgrade.
        # run_number orders the builds; the short SHA says what was built.
        # '+' sorts ABOVE the plain release in both dpkg and rpm version
        # comparison, which is what a testing channel wants ('~' would sort
        # below and make testing look older than stable). Tag builds set
        # nothing here and keep the clean version from Cargo.toml.
        if: github.event_name == 'workflow_dispatch'
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SUFFIX="ci${{ github.run_number }}.git$(git rev-parse --short HEAD)"
          # Keep the "-1" revision so the .deb stays a non-native package,
          # same shape as the stable one.
          echo "DEB_VERSION=${VER}+${SUFFIX}-1" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=1+${SUFFIX}"        >> "$GITHUB_ENV"
          echo "Testing build version: ${VER}+${SUFFIX}"

      - name: Build .deb
        run: |
          if [ -n "${DEB_VERSION:-}" ]; then
            cargo deb --no-build --no-strip --target ${{ matrix.target }} \
                      --deb-version "$DEB_VERSION"
          else
            cargo deb --no-build --no-strip --target ${{ matrix.target }}
          fi

      - name: Build .rpm
        # auto-req disabled: dependency scanning on a cross-built binary is
        # unreliable on the host; the binary only needs glibc which is ubiquitous.
        run: |
          if [ -n "${RPM_RELEASE:-}" ]; then
            cargo generate-rpm --target ${{ matrix.target }} --auto-req disabled \
                               -s "release = \"$RPM_RELEASE\""
          else
            cargo generate-rpm --target ${{ matrix.target }} --auto-req disabled
          fi

      - name: Collect packages
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/debian/*.deb out/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm out/
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/*

      # Kept separate from the packages artifact, which github2repo.sh consumes
      # by extension — the container image needs the bare binary.
      - name: Upload binary for the container image
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/easywaf

  # ─── Build and push the container image ─────────────────────
  # Uses the binaries from the build matrix rather than compiling again, so the
  # image ships exactly what was released and arm64 needs no QEMU emulation.
  docker:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    # Only a tag names a version to publish under; a manual run stops after the
    # build job, same as the release job below.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries

      - name: Stage binaries for the image
        # The Dockerfile picks by Docker's architecture names, which differ from
        # the ones used for the packages: x86_64 -> amd64.
        run: |
          mkdir -p dist
          cp binaries/binary-x86_64/easywaf dist/easywaf-amd64
          cp binaries/binary-arm64/easywaf  dist/easywaf-arm64
          chmod +x dist/easywaf-*
          ls -l dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"     # v0.3.0 -> 0.3.0
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing easysysio/easywaf:$VERSION and :latest"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            easysysio/easywaf:${{ env.VERSION }}
            easysysio/easywaf:latest
          labels: |
            org.opencontainers.image.title=EasyWAF
            org.opencontainers.image.description=Self-contained Web Application Firewall and reverse proxy
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/easysysio/EasyWAF
            org.opencontainers.image.licenses=GPL-3.0

  # ─── Create the GitHub Release ──────────────────────────────
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag carries a version to release under — a manual run stops after
    # the build job and leaves the packages as downloadable artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"     # v0.1.0 -> 0.1.0
          echo "Extracting notes for version: $VERSION"

          # Pull the section under "## [VERSION]" up to the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/           { exit }
            grab                       { print }
          ' CHANGELOG.md > notes.md

          # Fall back to the [Unreleased] section if no version section exists.
          if [ ! -s notes.md ]; then
            echo "No [$VERSION] section found — falling back to [Unreleased]"
            awk '
              /^## \[Unreleased\]/ { grab=1; next }
              grab && /^## \[/     { exit }
              grab                 { print }
            ' CHANGELOG.md > notes.md
          fi

          # Final fallback so the release is never created with empty notes.
          if [ ! -s notes.md ]; then
            echo "EasyWAF $VERSION" > notes.md
          fi

          echo "----- release notes -----"
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: EasyWAF ${{ github.ref_name }}
          body_path: notes.md
          files: dist/**/*
          fail_on_unmatched_files: true
