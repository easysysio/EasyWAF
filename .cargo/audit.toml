# =========================================================
# .cargo/audit.toml — EasyWAF
# Configuration for `cargo audit`.
# =========================================================

[advisories]
# RUSTSEC-2023-0071 — Marvin Attack (timing sidechannel) in `rsa`.
#
# There is no fixed version: the advisory has had no patched release since
# 2023-11-22, so this cannot be resolved by upgrading.
#
# `rsa` reaches the lockfile through `sqlx-mysql`, and Cargo.lock records the
# union of every optional dependency regardless of the features actually
# enabled. EasyWAF builds sqlx with the `sqlite` feature only, so `sqlx-mysql`
# is never compiled — `cargo tree -i sqlx-mysql --target all` returns nothing —
# and no RSA code reaches the binary.
#
# Re-check when sqlx's dependency changes or a fixed `rsa` is published.
#
# RUSTSEC-2026-0387 — timing variability in `crypto-bigint` 0.5's operations
# meant to be constant-time.
#
# The fix is crypto-bigint 0.7.6, which no release of `pgp` uses yet: 0.20.0
# and 0.21.0 both reach 0.5.5 through `elliptic-curve` 0.13 and `cx448`. The
# leak is of secret integers, and EasyWAF holds none here: `pgp` only verifies
# detached signatures on rule sets, lists and the country database
# (src/pgp_verify.rs), and the key, the signature and the signed file are all
# public. A timing difference in arithmetic on public values tells an
# observer nothing they could not compute.
#
# Re-check when `pgp` moves to crypto-bigint 0.7, or if EasyWAF ever signs.
#
# RUSTSEC-2026-0459 — SQLite before 3.54.0, bundled by `libsqlite3-sys` before
# 0.39, can return uninitialised page-cache memory when it opens a database
# together with a `-wal` file of a different page size.
#
# No release of sqlx takes the fix yet: 0.8.6 requires libsqlite3-sys ^0.30.1
# and 0.9.0 caps it below 0.38, so this cannot be resolved by upgrading.
#
# The attack needs a database and a `-wal` beside it that a less trusted party
# wrote, and EasyWAF never opens such a pair. Its own database lives in its
# data directory, which only root and the service write. An uploaded snapshot
# is inspected with `immutable=1` (src/backup.rs), which reads no `-wal` at
# all, and a restore deletes the replaced database's `-wal` and `-shm` before
# the snapshot is moved into place, so the restored file is never opened with
# a log it did not write. Anyone able to plant a `-wal` in the data directory
# can already replace the database itself.
#
# Re-check when sqlx accepts libsqlite3-sys 0.39.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387", "RUSTSEC-2026-0459"]
